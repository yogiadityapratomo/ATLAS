# CI ATLAS (Fase 6, docs/process/deployment-workflow.md §3): lint + seluruh test di setiap PR & push ke main.
# Test integrasi memakai PostgreSQL 18 sungguhan (service container), role & DB dibuat oleh bootstrap.py
# seperti di DEV. Password di sini hanya untuk container sementara CI — bukan secret environment mana pun.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUTF8: "1"
      ATLAS_ENV: dev
      ATLAS_DB_HOST: localhost
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pasang dependency
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test unit
        run: pytest -m "not integration" -q

      - name: Siapkan role & database test (bootstrap)
        env:
          PGPASSWORD: ci-only-postgres
        run: python scripts/db/bootstrap.py --database atlas_test --generate-missing-passwords

      - name: Test integrasi & API (PostgreSQL 18)
        run: pytest -m integration -q -rs

  # CSS frontend adalah hasil build Tailwind yang di-commit (server tidak punya Node/internet).
  # Job ini memastikan frontend/css/app.css selalu sama dengan hasil build dari frontend/src/app.css.
  frontend-css:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Pasang tooling (tanpa install script)
        run: npm ci --ignore-scripts

      - name: Build CSS & cek tidak ada perubahan
        run: |
          npm run build:css
          git diff --exit-code -- frontend/css/app.css
